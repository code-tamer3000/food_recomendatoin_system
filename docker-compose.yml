version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: food_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://admin:strongpassword123@mongo:27017/food_delivery?authSource=admin
    volumes:
      # hot-reload в dev: монтируем исходники
      - ./app:/app/app
      - ./data:/app/data
      - ./recsys_model.pkl:/app/recsys_model.pkl
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  mongo:
    image: mongo:7.0
    container_name: food_mongo
    ports:
      - "27017:27017"   # убрать в проде!
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=strongpassword123
      - MONGO_INITDB_DATABASE=food_delivery
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  mongo-express:
    image: mongo-express:latest
    container_name: food_mongo_ui
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=strongpassword123
      - ME_CONFIG_MONGODB_URL=mongodb://admin:strongpassword123@mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

volumes:
  mongo_data:
    driver: local

networks:
  backend:
    driver: bridge